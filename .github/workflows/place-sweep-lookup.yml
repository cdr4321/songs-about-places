name: Place sweep Wikipedia lookup (temporary)

# One-off helper for the place-name sweep on the place-sweep branch: looks the
# names in review/place_sweep/lookup_in.txt up on Wikipedia and commits
# lookup_out.csv. Removed before the branch is merged.

on:
  push:
    branches: [place-sweep]
    paths:
      - review/place_sweep/lookup_in.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Look the names up
        run: python review/place_sweep/wiki_lookup.py
      - name: Commit the results
        run: |
          git config user.name "songs-about-places bot"
          git config user.email "actions@github.com"
          git add review/place_sweep/lookup_out.csv
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Place sweep: Wikipedia lookups"
            git pull --rebase
            git push
          fi
