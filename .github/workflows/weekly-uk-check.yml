name: Weekly place-song check (UK)

on:
  schedule:
    - cron: "0 10 * * 6"   # Saturdays 10:00 UTC — Official Charts publishes Friday evenings
  workflow_dispatch:
    inputs:
      uk_since:
        description: "Backfill: read every week since this date (YYYY-MM-DD). Leave blank for the latest week."
        default: ""
      uk_weeks:
        description: "Otherwise, how many of the latest weeks to read"
        default: "1"

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4

      - name: Look for new songs that name a place
        id: scan
        env:
          UK_SINCE: ${{ inputs.uk_since }}
          UK_WEEKS: ${{ inputs.uk_weeks || '1' }}
          ISSUE_BODY: ${{ runner.temp }}/issue.md
        run: python scripts/find_new_uk_place_songs.py

      - name: Validate data/songs.csv
        run: python scripts/validate_data.py

      - name: Commit peak updates and the review queue
        run: |
          git config user.name "songs-about-places bot"
          git config user.email "actions@github.com"
          git add data/songs.csv review/uk_candidates.csv
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "UK weekly check: ${{ steps.scan.outputs.new }} new candidate(s), ${{ steps.scan.outputs.peaks }} peak update(s)"
            git pull --rebase
            git push
          fi

      - name: Open an issue when there is something to review
        if: steps.scan.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Review ${{ steps.scan.outputs.new }} UK candidate place-song row(s)" \
            --body-file "${{ runner.temp }}/issue.md"
