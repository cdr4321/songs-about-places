name: Weekly place-song check

on:
  schedule:
    - cron: "0 14 * * 3"   # Wednesdays 14:00 UTC — Billboard dates charts to Saturday
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Look for new songs that name a place
        id: scan
        run: python scripts/find_new_place_songs.py

      - name: Commit the review queue if it changed
        id: commit
        run: |
          git config user.name "songs-about-places bot"
          git config user.email "actions@github.com"
          git add review/candidates.csv
          if git diff --staged --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "No change to the review queue."
          else
            git commit -m "Weekly scan: refresh review queue"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when there is something to review
        if: steps.commit.outputs.changed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const csv = fs.readFileSync('review/candidates.csv', 'utf8').trim().split('\n');
            const n = csv.length - 1;
            if (n < 1) return;
            const head = csv[0].split(',');
            const iT = head.indexOf('title'), iA = head.indexOf('artist'),
                  iP = head.indexOf('place'), iN = head.indexOf('place_is_new');
            const lines = csv.slice(1, 26).map(r => {
              const c = r.split(',');
              return `- **${c[iT]}** — ${c[iA]} → ${c[iP]}${c[iN] ? '  ⚠️ new place, needs coordinates' : ''}`;
            });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Review ${n} candidate place-song${n === 1 ? '' : 's'}`,
              body: [
                `The weekly scan found **${n}** charting song${n === 1 ? '' : 's'} whose title may name a place.`,
                '',
                ...lines,
                n > 25 ? `\n…and ${n - 25} more in \`review/candidates.csv\`.` : '',
                '',
                '**To publish these:**',
                '1. Open `review/candidates.csv`',
                '2. Put `y` in the `approved` column for the ones that are genuine',
                '3. Fill in latitude/longitude for any row flagged as a new place',
                '4. Run `python scripts/apply_approved.py` and commit `data/places.json`',
                '',
                'Nothing goes live until you approve it. The matcher has a real false-positive rate — it cannot tell Ms. Jackson from Jackson, Mississippi.'
              ].join('\n')
            });
