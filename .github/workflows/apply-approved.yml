name: Apply approved candidates

# Runs when you commit a review queue after marking rows y / n.
# (Commits made by the weekly bots don't trigger this.)
on:
  push:
    paths:
      - "review/us_candidates.csv"
      - "review/uk_candidates.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Move approved rows into data/songs.csv
        run: python scripts/apply_approved.py
      - name: Validate (nothing is committed if this fails)
        run: python scripts/validate_data.py
      - name: Commit
        run: |
          git config user.name "songs-about-places bot"
          git config user.email "actions@github.com"
          git add data/songs.csv review/us_candidates.csv review/uk_candidates.csv scripts/place_terms.json
          if git diff --staged --quiet; then
            echo "Nothing approved or rejected."
          else
            git commit -m "Apply approved place-songs"
            git pull --rebase
            git push
          fi
