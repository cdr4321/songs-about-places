name: Validate data

on:
  push:
    paths: ["data/**"]
  pull_request:
    paths: ["data/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_data.py
